# Optional: triggers Vercel redeploy on push to main (Vercel Git integration also handles this).
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build-frontend:
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: https://vitality-api.onrender.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build

  validate-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python scripts/build_model.py
